<div class="page-container">
  <div class="page-header flex-between">
    <div>
      <h1 class="page-title">Liste de courses</h1>
    </div>
    <img class="header-icon desktop-only" src="/assets/basket.png" alt="Panier"/>
  </div>

  <!-- Summary of selected recipes, stock deductions and extra needs for these groceries -->
  <div *ngIf="(recettes && recettes.length > 0) || (stockIngredients && stockIngredients.length > 0) || (autresIngredients && autresIngredients.length > 0)" class="app-card recipes-summary-card">
    <div *ngIf="recettes && recettes.length > 0">
      <h3 class="section-title"><i class="pi pi-book section-icon"></i> Recettes prévues ({{ recettes.length }})</h3>
      <div class="recipes-chip-list">
        <span *ngFor="let r of recettes" class="recipe-chip" [pTooltip]="r.tooltipIngredients || r.stringIngredients">
          <i class="pi pi-check chip-icon"></i> {{ r.titre }}
        </span>
      </div>
    </div>

    <!-- En stock (déduit des courses) -->
    <div *ngIf="stockIngredients && stockIngredients.length > 0" class="summary-sub-section" style="margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border-color);">
      <h4 class="summary-sub-title text-xs font-bold" style="color: var(--primary-dark); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
        <i class="pi pi-box"></i> En stock <span class="card-subtitle-hint">(déduit des courses)</span> :
      </h4>
      <div class="flex-wrap gap-xs">
        <span *ngFor="let ing of stockIngredients" class="tag-badge" style="background-color: var(--primary-light); color: var(--primary-dark); border-color: rgba(16, 185, 129, 0.3);">
          <i class="pi pi-minus" style="font-size: 0.65rem;"></i> {{ ing.quantite }} {{ ing.produit?.unite }} {{ ing.produit?.label }}
        </span>
      </div>
    </div>

    <!-- À acheter (ajouté aux courses) -->
    <div *ngIf="autresIngredients && autresIngredients.length > 0" class="summary-sub-section" style="margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px solid var(--border-color);">
      <h4 class="summary-sub-title text-xs font-bold" style="color: #0369a1; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.35rem;">
        <i class="pi pi-shopping-bag"></i> À acheter <span class="card-subtitle-hint">(ajouté aux courses)</span> :
      </h4>
      <div class="flex-wrap gap-xs">
        <span *ngFor="let ing of autresIngredients" class="tag-badge" style="background-color: #f0f9ff; color: #0369a1; border-color: #bae6fd;">
          <i class="pi pi-plus" style="font-size: 0.65rem;"></i> {{ ing.quantite }} {{ ing.produit?.unite }} {{ ing.produit?.label }}
        </span>
      </div>
    </div>
  </div>

  <div class="app-card editor-card">
    <p-editor #editor [(ngModel)]="text" (ngModelChange)="onTextChange($event)" [style]="{'height':'400px'}"></p-editor>
  </div>

  <div class="app-card actions-card flex-between">
    <button pButton 
            type="button" 
            icon="pi pi-whatsapp" 
            class="whatsapp-btn" 
            (click)="shareOnWhatsApp()">
      <span class="whatsapp-label-desktop">Partager sur WhatsApp</span>
      <span class="whatsapp-label-mobile">WhatsApp</span>
    </button>
    <p-button icon="pi pi-copy" label="Copier" class="p-button-lg" [clipboard]="editor" (copied)="notify($event)"></p-button>
  </div>
</div>
