<div class="page-container">
  <div class="page-header flex-between">
    <div>
      <h1 class="page-title">Liste de courses</h1>
      <p class="page-subtitle">Visualisez et exportez votre liste d'ingrédients à acheter</p>
    </div>
    <img class="header-icon desktop-only" src="/assets/basket.png" alt="Panier"/>
  </div>

  <div class="app-card editor-card">
    <p-editor #editor [(ngModel)]="text" [style]="{'height':'400px'}"></p-editor>
  </div>

  <div class="app-card actions-card flex-between">
    <a href="https://www.leclercdrive.fr/" target="_blank" class="drive-link">
      <img src="https://mgt.leclercdrive.fr/communiques/visuelpagescontenu.ashx?id=340&type=2&mindim=60" alt="Leclerc Drive" class="drive-logo"/>
    </a>
    <p-button icon="pi pi-copy" label="Copier la liste" class="p-button-lg" [clipboard]="editor" (copied)="notify($event)"></p-button>
  </div>
</div>
