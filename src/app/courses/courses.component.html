<div class="page-container">
  <div class="page-header flex-between">
    <div>
      <h1 class="page-title">Liste de courses</h1>
      <p class="page-subtitle">Visualisez et exportez votre liste d'ingrédients à acheter</p>
    </div>
    <img class="header-icon desktop-only" src="/assets/basket.png" alt="Panier"/>
  </div>

  <!-- Summary of selected recipes for these groceries -->
  <div *ngIf="recettes && recettes.length > 0" class="app-card recipes-summary-card">
    <h3 class="section-title"><i class="pi pi-book section-icon"></i> Recettes prévues ({{ recettes.length }})</h3>
    <div class="recipes-chip-list">
      <span *ngFor="let r of recettes" class="recipe-chip">
        <i class="pi pi-check chip-icon"></i> {{ r.titre }}
      </span>
    </div>
  </div>

  <div class="app-card editor-card">
    <p-editor #editor [(ngModel)]="text" [style]="{'height':'400px'}"></p-editor>
  </div>

  <div class="app-card actions-card flex-between">
    <button pButton 
            type="button" 
            icon="pi pi-whatsapp" 
            class="whatsapp-btn" 
            (click)="shareOnWhatsApp()">
      <span class="whatsapp-label-desktop">Partager sur WhatsApp</span>
      <span class="whatsapp-label-mobile">WhatsApp</span>
    </button>
    <p-button icon="pi pi-copy" label="Copier la liste" class="p-button-lg" [clipboard]="editor" (copied)="notify($event)"></p-button>
  </div>
</div>
